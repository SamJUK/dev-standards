name: Test

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: shellcheck bin/samjuk-dev-standards rules/*/*.sh && shellcheck -s bash tests/helpers.bash
      - run: go install github.com/evilmartians/lefthook/v2@v2.2.2 && echo "$HOME/go/bin" >> "$GITHUB_PATH"
      - run: npx --yes bats@1.13.0 tests
