name: Release

# A vX.Y.Z tag becomes a GitHub release, with notes from the Conventional Commits since the previous tag.
# Push a signed tag, or run this from the Actions tab to tag the default branch's head.
# Packagist and GitHub dependencies install from the tag itself.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, e.g. v1.2.0
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TAG: ${{ inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # A tag pushed with the workflow's token starts no other run, so a manual release finishes here.
      - if: github.event_name == 'workflow_dispatch'
        run: |
          [[ $TAG =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::$TAG is not vX.Y.Z"; exit 1; }
          [ "$GITHUB_REF_NAME" = "$DEFAULT_BRANCH" ] || { echo "::error::run this from $DEFAULT_BRANCH"; exit 1; }
          git tag "$TAG"
          git push origin "$TAG"
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      - uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4.9.1
        with:
          args: --latest --strip header
        env:
          OUTPUT: NOTES.md
      - run: gh release create "$TAG" --verify-tag --title "$TAG" --notes-file NOTES.md
        env:
          GH_TOKEN: ${{ github.token }}
